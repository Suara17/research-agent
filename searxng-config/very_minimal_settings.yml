general:
  debug: false
  instance_name: 'SearXNG for Research Agent'

search:
  safe_search: 0
  default_lang: 'auto'
  max_page: 0
  default_categories: ['general']

server:
  base_url: 'http://localhost:8083/'
  port: 8080
  bind_address: '0.0.0.0'
  secret_key: 'very_long_secret_key_at_least_32_chars_long_12345'
  limiter: false
  public_instance: false

outgoing:
  request_timeout: 2.0

enabled_plugins:
  - 'self_info'

engines:
  - name: duckduckgo
    enabled: true
    shortcut: d
    timeout: 2.0
    categories: [general, web]