general:
  debug: false
  instance_name: 'SearXNG for Research Agent'
  enable_metrics: false

brand:
  # 从配置中移除可能有问题的字段
  small_logo: 'sea-turtle.svg'
  favicon: 'favicon.png'

search:
  safe_search: 0
  default_lang: 'auto'
  max_page: 0
  default_categories: ['general']

server:
  base_url: 'http://localhost:8083/'
  port: 8080
  bind_address: '0.0.0.0'
  secret_key: 'abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789'
  limiter: false
  public_instance: false

ui:
  default_theme: simple
  default_locale: ''
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 2.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

redis:
  url: false

enabled_plugins:
  - 'self_info'

# 引擎配置使用更标准的格式
engines:
  - name: duckduckgo
    enabled: true
    shortcut: d
    timeout: 2.0
    weight: 1
    categories: [general, web]
    about:
      website: https://duckduckgo.com/
      wikidata_id: Q12805
      official_api_documentation: https://duckduckgo.com/api
      use_official_api: false
      require_api_key: false
      results: HTML