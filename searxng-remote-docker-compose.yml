version: '3.9'
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-remote
    ports:
      - "8083:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://116.62.78.162:8083/
      - SEARXNG_PORT=8080
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
      - SEARXNG_DEBUG=true
      - SEARXNG_UWSGI_WORKERS=2
      - SEARXNG_UWSGI_THREADS=4
      - SEARXNG_UWSGI_MAX_REQUESTS=1000
      - SEARXNG_UWSGI_MAX_REQUESTS_DELTA=100
      - SEARXNG_UWSGI_LISTEN=100
    restart: unless-stopped
    networks:
      - searxng_net
    # 资源限制 (可选)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #       cpus: '1.0'
    #     reservations:
    #       memory: 512M
    #       cpus: '0.5'

networks:
  searxng_net:
    driver: bridge